$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://dnk-os.org/schemas/taskdna-proposal-v0.1.json"
title: "DNK TaskDNA Proposal Draft Schema v0.1"
description: "Defines the specification and validation rules for Git-backed TaskDNA Proposal drafts generated from curated AAB blocks."
type: "object"
required:
  - "schema_version"
  - "proposal_id"
  - "status"
  - "created_at"
  - "created_by"
  - "source_blocks"
  - "intent"
  - "constraints"
  - "execution_outline"
  - "traceability"
additionalProperties: false

properties:
  schema_version:
    type: "string"
    const: "dnk-taskdna-proposal/v0.1"

  proposal_id:
    type: "string"
    pattern: "^TDP-[0-9]{8}-[a-z0-9_-]+$"
    description: "Unique proposal identifier, e.g. TDP-20260909-workflow-pipeline."

  status:
    type: "string"
    enum:
      - "draft"
      - "reviewed"
      - "approved"
      - "rejected"
    description: "Lifecycle status of the proposal draft."

  created_at:
    type: "string"
    description: "ISO-8601 UTC timestamp."

  created_by:
    type: "string"
    description: "Tool or agent that generated the proposal draft."

  source_blocks:
    type: "array"
    minItems: 1
    description: "Eligible AAB source blocks bundled in this proposal."
    items:
      type: "object"
      required:
        - "id"
        - "title"
        - "source"
        - "evidence_paths"
      additionalProperties: false
      properties:
        id:
          type: "string"
          pattern: "^AAB-[A-Z0-9]+-[0-9]{3,}$"
        title:
          type: "string"
        source:
          type: "object"
          required:
            - "repository_id"
            - "license_spdx"
            - "assimilation_track"
          additionalProperties: false
          properties:
            repository_id:
              type: "string"
            repository_url:
              type: ["string", "null"]
            commit_sha:
              type: ["string", "null"]
            license_spdx:
              type: "string"
            assimilation_track:
              type: "string"
        evidence_paths:
          type: "array"
          items:
            type: "string"

  intent:
    type: "object"
    required:
      - "title"
      - "problem"
      - "proposed_outcome"
      - "target_domain"
      - "target_interface"
    additionalProperties: false
    properties:
      title:
        type: "string"
      problem:
        type: "string"
      proposed_outcome:
        type: "string"
      target_domain:
        type: "string"
      target_interface:
        type: "string"

  constraints:
    type: "object"
    required:
      - "required_capabilities"
      - "prohibited_actions"
      - "known_conflicts"
      - "license_obligations"
    additionalProperties: false
    properties:
      required_capabilities:
        type: "array"
        items:
          type: "string"
      prohibited_actions:
        type: "array"
        items:
          type: "string"
      known_conflicts:
        type: "array"
        items:
          type: "string"
      license_obligations:
        type: "array"
        items:
          type: "string"

  execution_outline:
    type: "object"
    required:
      - "suggested_owner"
      - "suggested_mode"
      - "suggested_slices"
      - "acceptance_criteria"
      - "verification_commands"
      - "rollback_plan"
    additionalProperties: false
    properties:
      suggested_owner:
        type: "string"
      suggested_mode:
        type: "string"
        enum:
          - "SOLO"
          - "SWARM_PARALLEL"
          - "SWARM_SEQUENTIAL"
      suggested_slices:
        type: "array"
        items:
          type: "string"
      acceptance_criteria:
        type: "array"
        items:
          type: "string"
      verification_commands:
        type: "array"
        items:
          type: "string"
      rollback_plan:
        type: "string"

  traceability:
    type: "object"
    required:
      - "source_aab_ids"
      - "linked_notes"
      - "linked_evidence"
    additionalProperties: false
    properties:
      source_aab_ids:
        type: "array"
        minItems: 1
        items:
          type: "string"
      linked_notes:
        type: "array"
        items:
          type: "string"
      linked_evidence:
        type: "array"
        items:
          type: "string"
      generated_by_commit:
        type: ["string", "null"]
