$schema: "http://json-schema.org/draft-07/schema#"
title: "DNK Canvas Message Schema"
description: "Declarative validation schema for DNK OS Canvas WebSocket/SSE delta streaming messages"
type: "object"
required:
  - "message_id"
  - "timestamp"
  - "message_type"
  - "sender_id"
  - "payload"
additionalProperties: false
properties:
  message_id:
    type: "string"
    description: "Unique message identifier (UUID or stable id)"
    minLength: 1
  timestamp:
    type: "string"
    description: "ISO-8601 UTC timestamp of message generation"
    format: "date-time"
  message_type:
    type: "string"
    description: "Event / operation discriminator"
    enum:
      - "canvas.state.update"
      - "canvas.node.add"
      - "canvas.node.remove"
      - "canvas.node.move"
      - "canvas.node.update"
      - "canvas.edge.add"
      - "canvas.edge.remove"
      - "canvas.edge.update"
      - "canvas.conflict"
      - "canvas.ack"
  sender_id:
    type: "string"
    description: "Identity of the emitting actor (e.g. gerych_prime, maksym, system, worker_id)"
    minLength: 1
  payload:
    type: "object"
    description: "Typed payload corresponding to the message_type"

definitions:
  CanvasStateUpdate:
    type: "object"
    required:
      - "canvas_id"
      - "version"
      - "state"
    additionalProperties: false
    properties:
      canvas_id:
        type: "string"
        minLength: 1
      version:
        type: "string"
        default: "v0.1"
      state:
        type: "object"
        description: "Full or snapshot CanvasState payload"

  CanvasNodeOperation:
    type: "object"
    required:
      - "operation"
      - "node"
    additionalProperties: false
    properties:
      operation:
        type: "string"
        enum: ["add", "remove", "move", "update"]
      node:
        type: "object"
        required: ["node_id"]
        properties:
          node_id:
            type: "string"
          type:
            type: "string"
          position:
            type: "object"
            properties:
              x:
                type: "number"
              y:
                type: "number"
          data:
            type: "object"

  CanvasEdgeOperation:
    type: "object"
    required:
      - "operation"
      - "edge"
    additionalProperties: false
    properties:
      operation:
        type: "string"
        enum: ["add", "remove", "update"]
      edge:
        type: "object"
        required: ["edge_id"]
        properties:
          edge_id:
            type: "string"
          source:
            type: "string"
          target:
            type: "string"
          label:
            type: "string"

  CanvasConflict:
    type: "object"
    required:
      - "conflict_id"
      - "path"
      - "base_value"
      - "local_value"
      - "remote_value"
      - "resolution"
    additionalProperties: false
    properties:
      conflict_id:
        type: "string"
        minLength: 1
      path:
        type: "string"
        description: "Dotted or key path where concurrent conflict occurred"
      base_value: {}
      local_value: {}
      remote_value: {}
      resolution:
        type: "string"
        enum: ["manual", "local", "remote", "base"]
        default: "manual"

  CanvasAck:
    type: "object"
    required:
      - "message_id"
      - "status"
    additionalProperties: false
    properties:
      message_id:
        type: "string"
        minLength: 1
      status:
        type: "string"
        enum: ["accepted", "rejected", "conflict"]
      reason:
        type: ["string", "null"]
        default: null
