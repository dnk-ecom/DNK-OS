[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dnk-os"
version = "2.5.0"
description = "Sovereign Microkernel & Agentic Cockpit for DNK OS"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "DNK-e.com Maksym & Antigravity" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.0.0",
    "pyyaml>=6.0",
    "mcp>=1.0.0,<2",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "psutil>=5.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
