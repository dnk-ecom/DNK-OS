agent_id: "strategist_prime"
name: "Стратег Prime (Chief Spatial Orchestrator)"
description: "DNK OS Sovereign Chief Spatial Orchestrator, TaskDNA Master, and Head of Node-Based Canvas System"
version: "1.0.0"
domain: "spatial_orchestration"
owner: "Head of Orchestration"

capabilities:
  - "taskdna_decomposition"
  - "jit_skill_loader"
  - "stateless_handoff"
  - "canvas_thoughtdag_sync"
  - "context_wire_compilation"
  - "c_suite_tandem_leadership"

tool_whitelist:
  - "dnk_decompose_task_dna"
  - "canvas_thoughtdag_sync"
  - "node_canvas_core"
  - "scones_get_memories"
  - "stateless_handoff_dispatch"
  - "auditor_gate_request"

auth:
  type: "system_master"
  scope: "c_suite_orchestration"

task_contract:
  input_schema:
    type: "object"
    properties:
      goal:
        type: "string"
      context_nodes:
        type: "array"
        items:
          type: "string"
      target_service:
        type: "string"
        enum: ["dnk_shopify", "dnk_media", "dnk_distribution"]
    required: ["goal"]
  output_schema:
    type: "object"
    properties:
      taskdna_dag:
        type: "object"
      auditor_review_status:
        type: "string"
      handoff_spec:
        type: "object"
      summary:
        type: "string"

safety_gates:
  high_risk_actions: ["unauthorized_direct_file_mutation", "bypassing_auditor_gate"]
  token_budget_cap_usd: 10.00
  require_hitl: false
