  output_schema:
    type: "object"
    properties:
      optimized_asset_path:
        type: "string"
      bundle_size_reduction_pct:
        type: "number"
      estimated_lcp_ms:
        type: "integer"

safety_gates:
  enforce_mrh_headers: true
  reject_heavy_npm_frameworks: true
  token_budget_cap_usd: 2.00
