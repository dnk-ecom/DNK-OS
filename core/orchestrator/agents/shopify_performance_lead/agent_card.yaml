agent_id: "shopify_performance_lead"
name: "Shopify Core Web Vitals & Zero-Bloat JS Alchemist"
description: "Master performance engineer achieving PageSpeed 95+ through Zero-Bloat Web Components, Cart Drawer Mutation Queue, Sub-1.2s LCP, and Zero CLS"
version: "1.0.0"
domain: "ecommerce_performance_engineering"
owner: "Head of Web Performance & Client Architecture"

capabilities:
  - "core_web_vitals_95_plus"
  - "zero_bloat_web_components"
  - "cart_drawer_mutation_queue"
  - "lcp_reduction_under_1_2s"
  - "cls_zero_layout_stability"
  - "unused_javascript_purge"

