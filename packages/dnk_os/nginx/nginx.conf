# --- DNK-MRH-HEADER ---
# mrh_id: "dnk_os/nginx/nginx.conf"
# purpose: "Nginx reverse proxy and load balancer configuration for DNK OS Multi-Agent Core"
# canonical_source: true
# alters_files: []
# triggers_tasks: []
# status: "Active"
# version: "1.0.0"
# updated_at: "2026-08-23"
# author: "DNK-e.com Maksym"
# --- END DNK-MRH-HEADER ---

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=stream_limit:10m rate=5r/s;

    # Upstream DNK OS API (load balanced)
    upstream dnk_api {
        least_conn;
        server dnk-api-1:8000 max_fails=3 fail_timeout=30s;
        server dnk-api-2:8000 max_fails=3 fail_timeout=30s;
        server dnk-api-3:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Upstream DNK OS Frontend
    upstream dnk_frontend {
        server dnk-frontend:3000;
    }

    # API server
    server {
        listen 80;
        server_name localhost;

        # Health check endpoint (no rate limit)
        location /health {
            proxy_pass http://dnk_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # Metrics endpoint (no rate limit)
        location /metrics {
            proxy_pass http://dnk_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Streaming endpoints (lower rate limit)
        location /stream/ {
            limit_req zone=stream_limit burst=20 nodelay;
            
            proxy_pass http://dnk_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # SSE support
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_set_header X-Accel-Buffering no;
            proxy_set_header Cache-Control no-cache;
            
            chunked_transfer_encoding off;
        }

        # Session endpoints (moderate rate limit)
        location /session/ {
            limit_req zone=api_limit burst=10 nodelay;
            
            proxy_pass http://dnk_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API endpoints (default rate limit)
        location / {
            limit_req zone=api_limit burst=10 nodelay;
            
            proxy_pass http://dnk_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Frontend (Next.js)
        location /app/ {
            proxy_pass http://dnk_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
