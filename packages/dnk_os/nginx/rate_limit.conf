# Rate limiting configurations
# Adjust based on your needs

# API rate limits
# - 10 requests/second per IP
# - Burst of 20 requests
# - No delay for burst

# Streaming rate limits
# - 5 requests/second per IP (SSE connections are long-lived)
# - Burst of 10 requests

# Session rate limits
# - 10 requests/second per IP
# - Burst of 20 requests

# Custom rate limit by API key (if implemented)
# limit_req_zone $http_x_api_key zone=api_key_limit:10m rate=100r/s;
