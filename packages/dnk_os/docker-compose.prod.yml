version: '3.8'

services:
  # Nginx reverse proxy (load balancer)
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/rate_limit.conf:/etc/nginx/conf.d/rate_limit.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - dnk-api-1
      - dnk-api-2
      - dnk-api-3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # DNK OS API instances (scaled)
  dnk-api-1:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://dnk:dnk_password@postgres:5432/dnk_os
      - REDIS_URL=redis://redis:6379/0
      - CHECKPOINTER_BACKEND=postgres
      - INSTANCE_ID=api-1
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  dnk-api-2:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://dnk:dnk_password@postgres:5432/dnk_os
      - REDIS_URL=redis://redis:6379/0
      - CHECKPOINTER_BACKEND=postgres
      - INSTANCE_ID=api-2
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  dnk-api-3:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://dnk:dnk_password@postgres:5432/dnk_os
      - REDIS_URL=redis://redis:6379/0
      - CHECKPOINTER_BACKEND=postgres
      - INSTANCE_ID=api-3
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # Frontend
  dnk-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: node-builder
    environment:
      - NEXT_PUBLIC_API_URL=http://nginx:80
    depends_on:
      - nginx
    restart: unless-stopped

  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=dnk
      - POSTGRES_PASSWORD=dnk_password
      - POSTGRES_DB=dnk_os
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dnk"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # pgvector
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=dnk
      - POSTGRES_PASSWORD=dnk_password
      - POSTGRES_DB=dnk_os_vectors
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  pgvector_data:
  nginx_logs:
